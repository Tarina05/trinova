<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/angular.js/1.8.3/angular.min.js"></script>
    <title></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <script>
        var mymodule = angular.module("kuchModule", []);

        mymodule.controller("kuchController", function ($scope, $http) {

            $scope.jsonArray = [];
            $scope.showTable = false;

            $scope.doFetchAll = function () {
                //alert($scope.txtEmail);
                var url = "/do-fetch-organizer-details";
                $http.get(url).then(allGoodFx, someBadFx);
                function allGoodFx(response) {
                    //resp in JSON array
                    // alert(JSON.stringify(response.data));
                    $scope.jsonArray = response.data;
                }

                function someBadFx(response) {
                    alert(JSON.stringify(response.data));
                }
            }

        })

    </script>

    <style>
        .outer-box {

            margin-top: 50px;
            max-width: 900px;
            background-color: white;
            box-shadow: 0 4px 8px gray;
            padding: 10px;

        }

        body {
            background-image: url(./pics/Blue\ watercolor\ sky\ and\ clouds_\ Light\ vector\ background.jpeg);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }
    </style>
</head>

<body ng-app="kuchModule" ng-controller="kuchController" ng-init="doFetchAll();" style="background-color: #FDF6EE;">
    <center>
        <div class="outer-box">

            <h4 class="mb-3" style="font-weight: bold; font-size: 1.5rem;"> <i class="fa-solid fa-user-tie"></i>  Organizers record </h4>
            <table class="table">
                <thead>
                    <tr class="table-info">
                        <th scope="col">Sr.No</th>
                        <th scope="col">Email Id</th>
                        <th scope="col">Organization Name</th>
                        <th scope="col">Registration Number</th>
                        <th scope="col">City</th>
                        <th scope="col">Sports</th>
                        <th scope="col">Contact</th>

                    </tr>
                </thead>
                <tbody>
                    <tr ng-repeat="obj in jsonArray">
                        <td>{{$index+1}}</td>
                        <td>{{obj.emailid}}</td>
                        <td>{{obj.orgname}}</td>
                        <td>{{obj.regnumber}}</td>
                        <td>{{obj.city}}</td>
                        <td>{{obj.sports}}</td>
                        <td>{{obj.contact}}</td>
                    </tr>
                </tbody>
            </table>

        </div>
    </center>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
        crossorigin="anonymous"></script>
</body>

</html>
