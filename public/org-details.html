<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">

    <!-- jquery file for ajax -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <style>
        .form-section {
            margin: auto;
            border: 1px solid #d0ebff;
            padding: 20px;
            background-color: #E0F7FA;
            border-radius: 12px;
            width: 900px;
        }


        body {
            background-color: #f4f6f8;;
            background-size: cover;
            background-position: center;
        }

        .btn-search {
            margin-top: 31px;
        }

        .preview-img {
            width: 80px;
            height: 100px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
    </style>

    <script>
        function showPrev(fileRef, prevRef) {
            const [file] = fileRef.files
            if (file) {
                prevRef.src = URL.createObjectURL(file)
            }
        }
    </script>

    <!-- search with ajax -->

    <script>
        $(document).ready(function () {
            $("#btnSearch").click(function () {
                let obj = {
                    type: "get",
                    url: "/get-one",
                    data: {
                        txtEmail: $("#txtEmail").val()
                    }
                }
                $.ajax(obj).then(
                    function (responseJsonAry) {

                        let orgname = responseJsonAry[0].orgname;
                        let regnumber = responseJsonAry[0].regnumber;
                        let address = responseJsonAry[0].address;
                        let city = responseJsonAry[0].city;
                        let sports = responseJsonAry[0].sports;
                        let website = responseJsonAry[0].website;
                        let insta = responseJsonAry[0].insta;
                        let head = responseJsonAry[0].head;
                        let contact = responseJsonAry[0].contact;
                        let picurl = responseJsonAry[0].picurl;
                        let otherinfo = responseJsonAry[0].otherinfo;

                        $("#txtOrgName").val(orgname);
                        $("#txtRegNo").val(regnumber);
                        $("#txtAddress").val(address);
                        $("#txtCity").val(city);
                        $("#txtDeals").val(sports);
                        $("#txtWebsite").val(website);
                        $("#txtInsta").val(insta);
                        $("#txtOrgHead").val(head);
                        $("#txtContact").val(contact);
                        $("#prev").prop("src", picurl);
                        $("#txtOtherInfo").val(otherinfo);

                        $("#hdn").val(picurl);

                    }).fail(function (err) { alert(err.message) })
            })

        })
    </script>

    <script>
        function showUser() {
            let activeUser = localStorage.getItem("activeUser");
            document.getElementById("txtEmail").value = activeUser;
        }
    </script>

</head>

<body onload="showUser();">


    <div class="container mt-4">
        <center>
            <h4 class="mb-3" style="font-weight: bold; font-size: 1.5rem;"><i class="fas fa-building me-2"></i> Organization Details </h4>

        </center>
        <div class="form-section">
            <form method="post" enctype="multipart/form-data">
                <input type="hidden" id="hdn" name="hdn">
                <div class="row mb-3">
                    <div class="col-md-9">
                        <label for="email" class="form-label"><i class="fas fa-envelope me-1"></i> Email ID</label>
                        <input type="email" class="form-control" id="txtEmail" name="txtEmail" required>
                    </div>
                    <div class="col-md-3 d-flex align-items-end">
                        <button type="button" id="btnSearch" class="btn btn-dark w-100"><i
                                class="fas fa-search me-1"></i> Search</button>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="orgName" class="form-label"><i class="fas fa-building"></i> Organization
                            Name</label>
                        <input type="text" class="form-control" id="txtOrgName" name="txtOrgName" required
                            placeholder="Enter your organization name">
                    </div>
                    <div class="col-md-6">
                        <label for="regNo" class="form-label"><i class="fas fa-id-badge"></i> Registration
                            Number</label>
                        <input type="text" class="form-control" id="txtRegNo" name="txtRegNo" required
                            placeholder="Govt-issued reg. number">
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="address" class="form-label"><i class="fas fa-map-marker-alt"></i> Address</label>
                        <input type="text" class="form-control" id="txtAddress" name="txtAddress" required
                            placeholder="Full address of your office">
                    </div>
                    <div class="col-md-6">
                        <label for="city" class="form-label"><i class="fas fa-city me-1"></i> City</label>
                        <input type="text" class="form-control" id="txtCity" name="txtCity" required
                            placeholder="City where based">
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-9">
                        <label for="deals" class="form-label"><i class="fas fa-basketball-ball"></i> Deals in
                            Sports</label>
                        <input type="text" class="form-control" id="txtDeals" name="txtDeals" required
                            placeholder="e.g., Cricket, Football, Athletics">
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="website" class="form-label"><i class="fas fa-globe"></i> Website</label>
                        <input type="text" class="form-control" id="txtWebsite" name="txtWebsite" required
                            placeholder="https://yourdomain.com">
                    </div>

                    <div class="col-md-6">
                        <label for="insta" class="form-label"><i class="fab fa-instagram"></i> Insta Link</label>
                        <input type="text" class="form-control" id="txtInsta" name="txtInsta" required
                            placeholder="https://instagram.com/yourpage">
                    </div>

                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="orgHead" class="form-label"><i class="fas fa-user-tie"></i> Head of
                            Organization</label>
                        <input type="text" class="form-control" id="txtOrgHead" name="txtOrgHead" required
                            placeholder="Full name of head">
                    </div>
                    <div class="col-md-6">
                        <label for="contact" class="form-label"><i class="fas fa-phone"></i> Contact Number</label>
                        <input type="text" class="form-control" id="txtContact" name="txtContact" required
                            placeholder="Official contact number">
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-9">
                        <label for="regCert" class="form-label"><i class="fas fa-upload me-1"></i> Registration
                            Certificate Pic</label>
                        <input class="form-control" type="file" name="ProfilePic" id="ProfilePic"
                            onchange="showPrev(ProfilePic,prev)" required>
                    </div>
                    <div class="col-md-3 d-flex align-items-end">
                        <img id="prev" class="preview-img" src="#" alt="">
                    </div>
                </div>


                <div class="mb-3">
                    <label for="otherInfo" class="form-label"> Other Information</label>
                    <textarea class="form-control" id="txtOtherInfo" name="txtOtherInfo" rows="3" required> </textarea>
                </div>

                <div class="d-flex justify-content-center mt-3">
                    <button type="submit" class="btn btn-dark me-5" formaction="/save-data"><i
                            class="fas fa-floppy-disk me-1"></i> Send to
                        Server</button>
                    <button type="submit" class="btn btn-dark" formaction="/modify-data"><i
                            class="fas fa-rotate me-1"></i>Modify</button>
                </div>

            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
        crossorigin="anonymous"></script>
</body>

</html>
