<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/angular.js/1.8.3/angular.min.js"></script>
    <title></title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <script>
        var mymodule = angular.module("kuchModule", []);

        mymodule.controller("kuchController", function ($scope, $http) {

            $scope.jsonArray = [];
            $scope.showTable = false;

            $scope.doFetchAll = function () {
                //alert($scope.txtEmail);
                $scope.showTable = true;
                var url = "/do-fetch-users-console";
                $http.get(url).then(allGoodFx, someBadFx);
                function allGoodFx(response) {
                    //resp in JSON array
                    // alert(JSON.stringify(response.data));
                    $scope.jsonArray = response.data;
                }

                function someBadFx(response) {
                    alert(JSON.stringify(response.data));
                }
            }

            $scope.doBlock = function (emailid) {
                var url = "/block-user?emailidKuch=" + emailid;
                $http.get(url).then(function (response) {
                    alert(response.data);
                    $scope.doFetchAll();
                }, function (response) {
                    alert("Error: " + JSON.stringify(response.data));
                });
            }

            $scope.doUnblock = function (emailid) {
                var url = "/unblock-user?emailidKuch=" + emailid;
                $http.get(url).then(function (response) {
                    alert(response.data);
                    $scope.doFetchAll();
                }, function (response) {
                    alert("Error: " + JSON.stringify(response.data));
                });
            }
        })

    </script>

    <style>
        .outer-box {

            margin-top: 50px;
            max-width: 900px;
            background-color: white;
            box-shadow: 0 4px 8px gray;
            padding: 10px;
            border: 1px solid black;

        }

        body {
            background-color: #f4f6f8;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }
    </style>
</head>

<body ng-app="kuchModule" ng-controller="kuchController" ng-init="doFetchAll();" >
    <center>
        <div class="outer-box">
            <h4 class="mb-3" style="font-weight: bold; font-size: 1.5rem;"><i class="fa-solid fa-users"></i> Enlisted
                Users </h4>
            <div ng-show="showTable">
                <table class="table">
                    <thead>
                        <tr class="table-info">
                            <th scope="col">Sr.No</th>
                            <th scope="col">Email Id</th>
                            <th scope="col">User Type</th>
                            <th scope="col">Status</th>
                            <th scope="col">Block User</th>
                            <th scope="col">Unblock User</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr ng-repeat="obj in jsonArray">
                            <td>{{$index+1}}</td>
                            <td>{{obj.emailid}}</td>
                            <td>{{obj.utype}}</td>
                            <td>{{obj.status}}</td>
                            <td>
                                <button type="button" class="btn btn-danger btn-sm " ng-click="doBlock(obj.emailid);">
                                    Block
                                </button>
                            </td>
                            <td>
                                <button type="button" class="btn btn-success btn-sm "
                                    ng-click="doUnblock(obj.emailid);">
                                    Unblock
                                </button>
                            </td>

                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </center>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
        crossorigin="anonymous"></script>
</body>

</html>
